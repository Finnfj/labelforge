name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The quick checks first, so a formatting slip fails in seconds rather than after
      # the browser download below. The same script the pre-commit hook runs, so the
      # list lives in package.json alone.
      - run: npm run check:static
      # The browser test tier drives a real Chromium through Playwright, and the
      # `playwright` package carries no install hook — `npm ci` does not fetch
      # browsers. Without this step the whole tier fails to launch. `--with-deps`
      # covers the shared libraries the runner image does not ship.
      - run: npx playwright install --with-deps chromium
      # The rest of `npm run check`, split from it only by the browser install above.
      - run: npm run check:slow
